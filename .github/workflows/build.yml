name: Windows exe 만들기
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PyInstaller 설치
        run: pip install pyinstaller==6.11.1
      - name: exe 빌드
        shell: pwsh
        run: |
          $v = $env:GITHUB_SHA
          (Get-Content "데스크.pyw" -Raw -Encoding UTF8) -replace 'BUILD_VERSION = "dev"', "BUILD_VERSION = `"$v`"" | Set-Content desk.pyw -Encoding UTF8
          (Get-Content "진료실.pyw" -Raw -Encoding UTF8) -replace 'BUILD_VERSION = "dev"', "BUILD_VERSION = `"$v`"" | Set-Content room.pyw -Encoding UTF8
          pyinstaller --onefile --noconsole --name desk desk.pyw
          pyinstaller --onefile --noconsole --name room room.pyw
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist/desk.exe "out/데스크.exe"
          Copy-Item dist/room.exe "out/진료실.exe"
          Copy-Item "사용방법.txt" out/
          Copy-Item dist/desk.exe out/desk.exe
          Copy-Item dist/room.exe out/room.exe
          Copy-Item dist/desk.exe "out/desk-$v.exe"
          Copy-Item dist/room.exe "out/room-$v.exe"
          Set-Content out/version.txt $v -NoNewline -Encoding ASCII
      - name: 단축키 시험
        continue-on-error: true
        shell: pwsh
        run: python hotkey_test.py *> out/hotkey_test.txt
      - uses: actions/upload-artifact@v4
        with:
          name: 진료카운터-v13
          path: out/
      - name: build 브랜치에 exe 저장
        shell: pwsh
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git checkout --orphan build
          git rm -rf --cached . | Out-Null
          Copy-Item out/* . -Force
          git add "데스크.exe" "진료실.exe" "사용방법.txt" desk.exe room.exe "desk-$env:GITHUB_SHA.exe" "room-$env:GITHUB_SHA.exe" version.txt
          if (Test-Path hotkey_test.txt) { git add hotkey_test.txt }
          git commit -m "exe build $env:GITHUB_SHA"
          git push -f origin build
